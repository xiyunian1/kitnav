services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-aggregator-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ai_aggregator
      POSTGRES_USER: ai_aggregator
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_aggregator -d ai_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ai.kitnav.com}
    container_name: ai-aggregator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./data/ppt-projects:/app/data/ppt-projects

  caddy:
    image: caddy:2-alpine
    container_name: ai-aggregator-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
