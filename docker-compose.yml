services:
  app:
    build: .
    container_name: ai-aggregator
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads

  caddy:
    image: caddy:2-alpine
    container_name: ai-aggregator-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
